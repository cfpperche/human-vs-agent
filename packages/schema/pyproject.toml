[project]
name = "hva-schema"
version = "0.1.0"
description = "Canonical data schema for the human-vs-agent study"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hva_schema"]
