[project]
name = "hva-collector"
version = "0.1.0"
description = "The collector package of the human-vs-agent pipeline"
requires-python = ">=3.12"
dependencies = ["hva-schema"]

[tool.uv.sources]
hva-schema = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hva_collector"]
